<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIFT X - Car Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:'Space Grotesk',sans-serif;overflow:hidden}
  #gameWrap{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 24px;display:flex;justify-content:space-between;align-items:center;background:#12121a;border-bottom:2px solid #2a2a3a;z-index:10}
  .logo{font-family:'Orbitron';letter-spacing:2px;font-size:20px}
  .logo span{color:#00ff88}
  .stats{display:flex;gap:18px;font-size:13px}
  .stat{background:#1e1e2e;padding:6px 12px;border-radius:8px;border:1px solid #333}
  .stat b{color:#00ff88}
  canvas{flex:1;width:100%;background:#111;cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
  #speed{font-family:'Orbitron';font-size:48px;color:#fff;text-shadow:0 0 20px #00ff88}
  #speed small{font-size:14px;color:#888}
  #controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .key{background:rgba(255,255,255,0.08);border:1px solid #333;padding:8px 12px;border-radius:8px;font-size:12px;backdrop-filter:blur(8px)}
  .key.active{background:#00ff88;color:#000;border-color:#00ff88}
  #startScreen, #winScreen{position:absolute;inset:0;background:rgba(5,5,10,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
  #winScreen{display:none}
  h1{font-family:'Orbitron';font-size:48px;margin-bottom:10px}
  h1 span{color:#00ff88}
  p{color:#888;max-width:400px;margin:10px 0 24px}
  button{background:#00ff88;color:#000;font-family:'Orbitron';font-weight:700;padding:14px 32px;border:none;border-radius:12px;cursor:pointer;font-size:16px;transition:0.2s}
  button:hover{transform:scale(1.05);box-shadow:0 0 30px #00ff88aa}
  .mobile{display:none}
  @media(max-width:700px){
    .desktop{display:none}
    .mobile{display:flex}
    #mobileCtrl{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}
    .m-btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:22px;user-select:none}
  }
</style>
</head>
<body>
<div id="gameWrap">
  <header>
    <div class="logo">DRIFT <span>X</span></div>
    <div class="stats">
      <div class="stat">LAP: <b id="lap">1/3</b></div>
      <div class="stat">TIME: <b id="time">00:00</b></div>
      <div class="stat">BEST: <b id="best">--:--</b></div>
    </div>
  </header>
  
  <div id="hud"><div id="speed">0<small> KM/H</small></div></div>
  <canvas id="c"></canvas>

  <div id="controls" class="desktop">
    <div class="key" id="k-up">W / ↑ - Accelerate</div>
    <div class="key" id="k-down">S / ↓ - Brake</div>
    <div class="key" id="k-left">A / ← - Left</div>
    <div class="key" id="k-right">D / → - Right</div>
    <div class="key" id="k-nitro">SHIFT - NITRO</div>
  </div>

  <div id="mobileCtrl" class="mobile">
    <div style="display:flex;gap:12px">
      <div class="m-btn" id="m-left">◀</div>
      <div class="m-btn" id="m-right">▶</div>
    </div>
    <div style="display:flex;gap:12px">
      <div class="m-btn" id="m-brake">▼</div>
      <div class="m-btn" id="m-gas" style="background:#00ff88;color:#000">▲</div>
    </div>
  </div>

  <div id="startScreen">
    <h1>DRIFT <span>X</span></h1>
    <p>Top-down street racing. Use nitro on straights, drift on corners. Complete 3 laps as fast as possible.</p>
    <button onclick="startGame()">START ENGINE</button>
  </div>

  <div id="winScreen">
    <h1>RACE <span>COMPLETE</span></h1>
    <p id="winText"></p>
    <button onclick="startGame()">RACE AGAIN</button>
  </div>
</div>
