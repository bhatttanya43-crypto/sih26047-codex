<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AyushSetu</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:Arial;background:#eef5ee;padding:12px;margin:0}.container{max-width:900px;margin:auto;background:#fff;padding:18px;border-radius:12px}.card{padding:15px;border-radius:10px;margin:15px 0}.green{background:#e8f5e9;border-left:5px solid #2e7d32}.blue{background:#e3f2fd;border-left:5px solid #1565c0}.orange{background:#fff8e1;border:2px dashed #ff9800}.purple{background:#f3e5f5;border-left:5px solid #6a1b9a} input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px} button{padding:10px 16px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.btn{width:100%;background:#2e7d32;color:#fff;padding:12px}.opt{display:block;background:#fff;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:6px}</style></head><body><div class="container"><h1 style="text-align:center;color:#1b5e20">🌿 AyushSetu</h1><p style="text-align:center">SIH26047 | Team Codex</p><div class="card green"><h3>1. Patient Details</h3><input id="pName" placeholder="Name"><input id="pAge" type="number" placeholder="Age"><textarea id="pHistory" rows="4" placeholder="Case History"></textarea></div><div class="card blue"><h3>2. Prakriti Quiz</h3><p>Q1 Body?</p><label class="opt"><input type="radio" name="q1" value="Vata"> Patla - Vata</label><label class="opt"><input type="radio" name="q1" value="Pitta"> Medium - Pitta</label><label class="opt"><input type="radio" name="q1" value="Kapha"> Bhaari - Kapha</label><p>Q2 Skin?</p><label class="opt"><input type="radio" name="q2" value="Vata"> Rukhi - Vata</label><label class="opt"><input type="radio" name="q2" value="Pitta"> Oily - Pitta</label><label class="opt"><input type="radio" name="q2" value="Kapha"> Soft - Kapha</label><p>Q3 Nature?</p><label class="opt"><input type="radio" name="q3" value="Vata"> Active - Vata</label><label class="opt"><input type="radio" name="q3" value="Pitta"> Sharp - Pitta</label><label class="opt"><input type="radio" name="q3" value="Kapha"> Shaant - Kapha</label><button onclick="checkP()" style="background:#1565c0;color:white;width:100%;margin-top:8px">Result Dekho</button><div id="qRes" style="font-weight:bold;color:green;margin-top:8px"></div></div><div class="card orange"><h3>📄 3. Report Scanner</h3><input type="file" id="file" accept="image/*"><button onclick="scan()" style="background:#e65100;color:white">Scan Karo</button><div id="scanR" style="background:#fff;padding:10px;margin-top:8px;min-height:30px">Scanned text yaha ayega</div></div><div class="card purple"><h3>🎙️ 4. Voice Input</h3><button onclick="voice()" style="background:#1565c0;color:white">🎤 Bolna Shuru</button><div id="voiceR" style="background:#fff;padding:8px;margin-top:8px">Voice...</div></div><div class="card green"><h3>5. Prescription</h3><textarea placeholder="Advice"></textarea><button class="btn" onclick="window.print()">💾 Submit & PDF</button></div></div><script>function checkP(){let v=0,p=0,k=0,a=[...document.querySelectorAll('input[type=radio]:checked')];if(a.length<3){alert('3 sawal bharo');return;}a.forEach(x=>{if(x.value=='Vata')v++;if(x.value=='Pitta')p++;if(x.value=='Kapha')k++;});let r=v>p&&v>k?'Vata':p>v&&p>k?'Pitta':k>v&&k>p?'Kapha':'Mixed';document.getElementById('qRes').innerText='Prakriti: '+r;document.getElementById('pHistory').value+='\nPrakriti:'+r;}async function scan(){let f=document.getElementById('file').files[0],o=document.getElementById('scanR');if(!f){alert('Photo lo');return;}o.innerText='Scanning...';let res=await Tesseract.recognize(f,'eng+hin');o.innerText=res.data.text;document.getElementById('pHistory').value+='\nReport:'+res.data.text;}function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Chrome use karo');return;}let rec=new SR();rec.lang='hi-IN';rec.onresult=e=>{let t=e.results[0][0].transcript;document.getElementById('voiceR').innerText=t;document.getElementById('pHistory').value+=' '+t;};rec.start();}</script></body></html>
