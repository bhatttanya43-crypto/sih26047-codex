<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIH26047 - Team Codex</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50">
<div class="bg-[#4A1A2A] text-white p-4 text-center">
<h1 class="font-bold">SIH26047 | Team Codex | Patient Case-Taking Software</h1>
<p class="text-xs">Frontend: HTML/CSS/JS | Backend: Python Flask | Database: MySQL</p>
</div>
<div class="max-w-4xl mx-auto p-4 grid md:grid-cols-2 gap-4 mt-4">
<div class="bg-white p-5 rounded-xl shadow">
<h2 class="font-bold">1. Patient Registration</h2>
<input id="pName" placeholder="Patient Name" class="w-full border p-2 rounded mt-2">
<select id="pPrakriti" class="w-full border p-2 rounded mt-2"><option>Vata</option><option>Pitta</option><option>Kapha</option></select>
<textarea id="complaint" placeholder="Chief Complaint" class="w-full border p-2 rounded mt-2 h-20"></textarea>
<div class="flex gap-2 mt-2"><label><input type="checkbox" class="dosha" value="Vata"> Vata</label><label><input type="checkbox" class="dosha" value="Pitta"> Pitta</label><label><input type="checkbox" class="dosha" value="Kapha"> Kapha</label></div>
<textarea id="treatment" placeholder="Ayush Prescription" class="w-full border p-2 rounded mt-2 h-20"></textarea>
<button onclick="saveCase()" class="w-full bg-[#4A1A2A] text-white py-2 rounded mt-4">Save Case</button>
</div>
<div class="bg-white p-5 rounded-xl shadow">
<h2 class="font-bold">2. Timeline & Export</h2>
<div id="timeline" class="mt-3 space-y-2 text-sm"></div>
<button onclick="window.print()" class="w-full bg-green-600 text-white py-2 rounded mt-4">Print / Save as PDF</button>
</div>
</div>
<script>
let cases=JSON.parse(localStorage.getItem('c')||'[]');
function saveCase(){
let dosha=[...document.querySelectorAll('.dosha:checked')].map(e=>e.value).join(',');
let c={name:pName.value,prakriti:pPrakriti.value,comp:complaint.value,dosha,treat:treatment.value,date:new Date().toLocaleString()};
cases.unshift(c);localStorage.setItem('c',JSON.stringify(cases));render();alert('Case Saved!');
}
function render(){
timeline.innerHTML=cases.map(c=>`<div class='border p-2 rounded'><b>${c.name}</b> - ${c.prakriti} (${c.dosha})<br><span class='text-xs'>${c.comp}</span></div>`).join('');
}
render();
</script>
</body>
</html>
